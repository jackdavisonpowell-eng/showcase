<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase — autogod</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,800;0,900;1,800;1,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script>
/* ══════════════════════════════════════════════════════════════════════════
   ██  THIS IS THE ONLY PART YOU EDIT.  ██
   ══════════════════════════════════════════════════════════════════════════

   One object per thing you made. Delete the three examples below and write
   your own — the page builds itself from this list: the grid, the tag
   filter, the counters up top, the lightbox. Nothing else needs touching.

   Every field is optional except `title`. Leave one out and the card just
   doesn't draw that part.

     title    the name. Goes in big italic caps.
     kicker   the small line ABOVE the title. What kind of thing it is.
     blurb    two or three sentences. What it does and what was hard.
     tags     free-form. Every tag you use becomes a filter key at the top.
     date     "2026-09" or "2026-09-08". Sorts newest first, shown as-is.
     status   "live" · "building" · "shelved" — anything else prints as-is.
              "live" is the only one that lights up white.
     feature  true = this card spans two columns. Use it once or twice.
     href     click-through. Omit for no link.
     stats    [["label","value"], …]  the little readout row on the card.
              This is what stops it reading like a portfolio and starts it
              reading like telemetry. Two or three is the right number.
     media    {type:"image", src:"media/thing.png"}
              {type:"video", src:"media/thing.mp4", poster:"media/thing.png"}
              {type:"embed", src:"https://…"}       an iframe
              omit it entirely and the card draws a hatched placeholder with
              the title's initials — which is what the examples do, so the
              page looks right before you have a single screenshot.

   Screenshots go in ./media/ next to this file. Nothing is uploaded and
   nothing is fetched: it is one HTML file and a folder of images.
   ══════════════════════════════════════════════════════════════════════ */

const WORK = [
  {
    title: "Example One",
    kicker: "replace me",
    blurb: "The first card is a feature — it spans two columns, so put the thing you are proudest of here. Say what it does in one sentence, then say the part that was actually hard.",
    tags: ["example", "local llm"],
    date: "2026-09",
    status: "live",
    feature: true,
    stats: [["built in", "2 days"], ["runs on", "P100 ×2"], ["tokens", "27M"]],
    // media: {type: "image", src: "media/example-one.png"},
  },
  {
    title: "Example Two",
    kicker: "replace me",
    blurb: "A normal card. One column. This is what most entries will look like.",
    tags: ["example", "web"],
    date: "2026-08",
    status: "building",
    stats: [["state", "wip"]],
  },
  {
    title: "Example Three",
    kicker: "replace me",
    blurb: "Things you stopped working on still belong here — a shelved card with an honest blurb reads better than a gap.",
    tags: ["example"],
    date: "2026-07",
    status: "shelved",
  },
];

/* The two lines under the wordmark. Yours to write. */
const INTRO = {
  title: "Showcase",
  line: "things I built with AI — what it is, what it runs on, what it cost",
};
</script>

<style>
  /* The AUTOGOD v7 language, trimmed to what this page uses: zero radii,
     45° chamfers cut top-left / bottom-right and LIT so the bevel reads as a
     drawn line, hatch rules, segmented bars, monotone white on black.
     Deliberately self-contained — this page has no server and no build, so
     you can open it off a USB stick and it still looks like the wall. */
  :root{
    --ground:#000;
    --text:#F4F5F8; --muted:#9BA0AE; --faint:#5D6170;
    --live:#FFFFFF; --live-glo:rgba(255,255,255,.45);
    --dim:#40444F;
    --slab:linear-gradient(176deg,rgba(17,19,25,.56),rgba(4,5,8,.68));
    --key:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.022));
    --key-hi:linear-gradient(180deg,rgba(255,255,255,.155),rgba(255,255,255,.045));
    --edge:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -1px 0 rgba(0,0,0,.62);
    --sink:inset 0 2px 6px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.05);
    --line-soft:rgba(255,255,255,.07);
    --hatch:repeating-linear-gradient(118deg,rgba(255,255,255,.22) 0 1px,transparent 1px 6px);
    --f-d:"Archivo","Helvetica Neue",Arial,sans-serif;
    --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --cut:20px; --cut-m:12px; --cut-s:7px;
  }
  *{box-sizing:border-box}
  html{background:var(--ground)}
  body{margin:0;background:transparent;color:var(--text);font-family:var(--f-m);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
       padding:.55rem .7rem 4rem}
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none}
  button{font:inherit}
  a{color:inherit;text-decoration:none}

  /* the cut, and the light along it */
  .cut{--c:var(--cut);position:relative;
       clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
  .cut::before{content:"";position:absolute;left:0;top:0;pointer-events:none;z-index:3;
       width:calc(var(--c) * 2);height:calc(var(--c) * 2);
       background:linear-gradient(135deg,rgba(255,255,255,.55) 0 1.5px,transparent 1.5px)}
  .cut::after{content:"";position:absolute;right:0;bottom:0;pointer-events:none;z-index:3;
       width:calc(var(--c) * 2);height:calc(var(--c) * 2);
       background:linear-gradient(315deg,rgba(255,255,255,.22) 0 1.5px,transparent 1.5px)}
  .plate{background:var(--slab);backdrop-filter:blur(4px) saturate(1.1);z-index:1;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.7)}

  /* ══ header ══ */
  .top{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem .55rem;
       margin-bottom:.45rem}
  .wm{display:inline-flex;align-items:center;font-family:var(--f-d);font-style:italic;
       font-weight:900;font-size:clamp(1.3rem,2.15vw,1.95rem);text-transform:uppercase;
       line-height:1;white-space:nowrap;text-shadow:0 0 22px rgba(235,238,245,.3)}
  .wm::before{content:"";width:1.3rem;height:1.15rem;flex:none;margin-right:.7rem;
       background:var(--text);opacity:.9;clip-path:polygon(38% 0,100% 0,62% 100%,0 100%)}
  .wm i{color:var(--muted)}
  .top .sp{flex:1;height:8px;background:var(--hatch);opacity:.35;
       -webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);
       mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
  .count{font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
       white-space:nowrap}
  .hnav{display:flex;gap:.4rem;flex:none;flex-wrap:wrap;justify-content:flex-end}
  .hbtn{--c:var(--cut-s);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;
       padding:.5rem .9rem;background:var(--key);color:var(--muted);box-shadow:var(--edge);
       white-space:nowrap;
       clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
  .hbtn:hover{background:var(--key-hi);color:var(--text)}
  .hbtn.on{color:#07080B;background:linear-gradient(180deg,#FFF,#CFD3DD);font-weight:600}

  /* ══ the title block + tag filter ══ */
  .lede{padding:1.5rem 1.2rem 1.3rem;margin-bottom:.45rem;
       display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap}
  .lede .l{flex:1 1 26rem;min-width:0}
  .ledger{display:flex;gap:0;flex:none;align-self:stretch;align-items:flex-start}
  .ledger div{padding:.1rem 1.15rem;min-width:6.5rem}
  .ledger div+div{box-shadow:inset 1px 0 0 var(--line-soft)}
  .ledger .rv{font-family:var(--f-d);font-style:italic;font-weight:900;
       font-size:clamp(1.5rem,2.4vw,2.2rem);line-height:1;font-variant-numeric:tabular-nums;
       letter-spacing:-.02em;text-shadow:0 0 20px rgba(235,238,245,.14)}
  .ledger .rk{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;
       color:var(--faint);margin-top:.4rem;white-space:nowrap}
  @media (max-width:56rem){.ledger{width:100%}.ledger div{flex:1;min-width:0}}
  .lede h1{font-family:var(--f-d);font-style:italic;font-weight:900;margin:0;
       font-size:clamp(2.2rem,6vw,4.6rem);line-height:.95;letter-spacing:-.02em;
       text-transform:uppercase;text-shadow:0 0 40px rgba(235,238,245,.22)}
  .lede p{margin:.7rem 0 0;color:var(--muted);font-size:.86rem;max-width:52ch}
  .filters{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:1.2rem;align-items:center}
  .filters .lbl{font-size:.6rem;letter-spacing:.19em;text-transform:uppercase;
       color:var(--faint);margin-right:.4rem}
  .fb{--c:var(--cut-s);font-family:var(--f-m);font-size:.65rem;letter-spacing:.15em;
       text-transform:uppercase;padding:.5rem 1rem;border:0;background:var(--key);
       color:var(--muted);cursor:pointer;white-space:nowrap;
       clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
       box-shadow:var(--edge);
       transition:transform .08s linear,background .1s linear,color .1s linear}
  .fb:hover{background:var(--key-hi);color:var(--text);transform:translateY(-1px)}
  .fb.on{color:#07080B;background:linear-gradient(180deg,#FFF,#CFD3DD);font-weight:600}

  /* ══ the grid ══ */
  .grid{display:grid;gap:.45rem;grid-auto-flow:dense;
       grid-template-columns:repeat(auto-fill,minmax(min(23rem,100%),1fr))}
  .card{--c:var(--cut);display:flex;flex-direction:column;overflow:hidden;
       cursor:pointer;text-align:left;border:0;padding:0;font:inherit;color:inherit;
       transition:transform .1s linear,box-shadow .12s linear}
  .card.feat{grid-column:span 2}
  @media (max-width:52rem){.card.feat{grid-column:span 1}}
  .card:hover{transform:translateY(-2px);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 34px -12px var(--live-glo)}
  .card:focus-visible{outline:2px solid var(--live);outline-offset:2px}

  /* the preview well. No image yet? then a hatched plate with the initials —
     the page has to look finished before it has any content in it. */
  .shot{position:relative;aspect-ratio:16/9;overflow:hidden;background:rgba(0,0,0,.45);
       box-shadow:var(--sink);flex:none}
  .card.feat .shot{aspect-ratio:21/9}
  .shot img,.shot video,.shot iframe{width:100%;height:100%;object-fit:cover;
       display:block;border:0}
  .shot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       background:var(--hatch);background-color:rgba(255,255,255,.02);opacity:.5}
  .shot .ph span{font-family:var(--f-d);font-style:italic;font-weight:900;
       font-size:clamp(2rem,6vw,4rem);color:var(--text);opacity:.35;letter-spacing:.06em}
  .stag{position:absolute;left:0;bottom:0;display:flex;gap:.3rem;padding:.5rem;z-index:2}
  .chip{--c:var(--cut-s);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
       padding:.32rem .7rem;color:var(--muted);background:rgba(4,5,8,.85);
       box-shadow:var(--edge);white-space:nowrap;
       clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
  .chip.live{color:#07080B;background:#FFF;font-weight:600}

  .body{padding:.85rem 1rem 1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
  .kick{font-size:.6rem;letter-spacing:.19em;text-transform:uppercase;color:var(--faint);
       display:flex;align-items:center;gap:.45rem}
  .kick::before{content:"";width:5px;height:9px;flex:none;background:currentColor;
       opacity:.55;clip-path:polygon(40% 0,100% 0,60% 100%,0 100%)}
  .card h2{font-family:var(--f-d);font-style:italic;font-weight:900;margin:0;
       font-size:clamp(1.3rem,2.1vw,1.85rem);line-height:1.05;text-transform:uppercase;
       letter-spacing:-.01em}
  .card p{margin:0;color:var(--muted);font-size:.8rem;line-height:1.55}
  .card .tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:auto;padding-top:.3rem}
  .card .tags b{font-size:.57rem;letter-spacing:.15em;text-transform:uppercase;
       color:var(--faint);font-weight:400}
  .card .tags b::before{content:"/ "}
  /* the readout row — this is the bit that makes it telemetry, not a portfolio */
  .reads{display:flex;gap:0;margin-top:.2rem;box-shadow:inset 0 1px 0 var(--line-soft)}
  .reads div{flex:1;min-width:0;padding:.5rem .1rem .1rem}
  .reads div+div{box-shadow:inset 1px 0 0 var(--line-soft);padding-left:.7rem}
  .reads .rv{font-family:var(--f-d);font-style:italic;font-weight:900;font-size:1.05rem;
       line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  .reads .rk{font-size:.55rem;letter-spacing:.17em;text-transform:uppercase;
       color:var(--faint);margin-top:.15rem;white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis}
  .when{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

  /* nothing in WORK yet */
  .void{padding:4rem 1.5rem;text-align:center;color:var(--faint)}
  .void b{display:block;font-family:var(--f-d);font-style:italic;font-weight:900;
       font-size:2rem;color:var(--muted);text-transform:uppercase;margin-bottom:.6rem}

  /* ══ lightbox ══ */
  .lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);
       display:none;align-items:center;justify-content:center;padding:2.5rem;
       backdrop-filter:blur(6px)}
  .lb.on{display:flex;animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lb .inner{--c:var(--cut);max-width:min(1400px,94vw);max-height:90vh;width:100%;
       display:flex;flex-direction:column;overflow:hidden}
  .lb .shot{aspect-ratio:16/9;max-height:66vh}
  .lb .lbody{padding:1.1rem 1.3rem 1.3rem;display:flex;flex-direction:column;gap:.55rem;
       overflow:auto}
  .lb h2{font-size:clamp(1.6rem,3.2vw,2.6rem)}
  .lb p{font-size:.88rem;max-width:70ch}
  .lb .x{position:fixed;top:1.1rem;right:1.2rem;--c:var(--cut-s);border:0;padding:.55rem 1.1rem;
       background:var(--key);color:var(--muted);box-shadow:var(--edge);cursor:pointer;
       font-family:var(--f-m);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;
       clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
  .lb .x:hover{background:var(--key-hi);color:var(--text)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<header class="top cut plate">
  <span class="wm">autogod<i>.org</i></span>
  <span class="sp"></span>
  <nav class="hnav">
    <a class="hbtn" href="/">Home</a>
    <a class="hbtn" href="/portfolio/">About</a>
    <a class="hbtn on" href="/showcase/">Showcase</a>
    <a class="hbtn" href="https://fleet.autogod.org/">Login</a>
  </nav>
  <span class="count" id="count"></span>
</header>

<section class="lede cut plate">
  <div class="l">
    <h1 id="h1"></h1>
    <p id="lede"></p>
    <div class="filters" id="filters"></div>
  </div>
  <div class="ledger" id="ledger"></div>
</section>

<main class="grid" id="grid"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" id="lbx">close · esc</button>
  <div class="inner cut plate" id="lbin"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("h1").textContent = INTRO.title;
$("lede").textContent = INTRO.line;

/* newest first. A missing date sorts last rather than to the top — an entry
   you forgot to date should not take the best slot on the page. */
const ITEMS = [...WORK].sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
const TAGS = [...new Set(ITEMS.flatMap(w => w.tags || []))].sort();
let FILTER = null;

function initials(t) {
  return String(t || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
}
function shotHTML(w) {
  const m = w.media;
  let inner = `<div class="ph"><span>${esc(initials(w.title))}</span></div>`;
  if (m && m.type === "image" && m.src) inner = `<img src="${esc(m.src)}" alt="${esc(w.title)}" loading="lazy">`;
  else if (m && m.type === "video" && m.src) inner = `<video src="${esc(m.src)}"${m.poster ? ` poster="${esc(m.poster)}"` : ""} muted loop playsinline autoplay></video>`;
  else if (m && m.type === "embed" && m.src) inner = `<iframe src="${esc(m.src)}" loading="lazy" title="${esc(w.title)}"></iframe>`;
  const st = w.status ? `<span class="chip ${w.status === "live" ? "live" : ""}">${esc(w.status)}</span>` : "";
  const dt = w.date ? `<span class="chip">${esc(w.date)}</span>` : "";
  return `<div class="shot">${inner}<div class="stag">${st}${dt}</div></div>`;
}
function cardHTML(w) {
  const reads = (w.stats || []).length
    ? `<div class="reads">${w.stats.map(([k, v]) =>
        `<div><div class="rv">${esc(v)}</div><div class="rk">${esc(k)}</div></div>`).join("")}</div>`
    : "";
  return `<button class="card cut plate ${w.feature ? "feat" : ""}" data-i="${ITEMS.indexOf(w)}">
    ${shotHTML(w)}
    <div class="body">
      ${w.kicker ? `<div class="kick">${esc(w.kicker)}</div>` : ""}
      <h2>${esc(w.title)}</h2>
      ${w.blurb ? `<p>${esc(w.blurb)}</p>` : ""}
      ${reads}
      ${(w.tags || []).length ? `<div class="tags">${w.tags.map(t => `<b>${esc(t)}</b>`).join("")}</div>` : ""}
    </div></button>`;
}
function draw() {
  const show = ITEMS.filter(w => !FILTER || (w.tags || []).includes(FILTER));
  $("grid").innerHTML = show.length
    ? show.map(cardHTML).join("")
    : `<div class="void cut plate" style="grid-column:1/-1"><b>nothing here yet</b>
       open this file and fill in the <code>WORK</code> list at the top.</div>`;
  $("count").textContent = `${show.length} of ${ITEMS.length} shown`;
  $("filters").innerHTML = `<span class="lbl">filter</span>` +
    `<button class="fb ${FILTER ? "" : "on"}" data-tag="">all</button>` +
    TAGS.map(t => `<button class="fb ${FILTER === t ? "on" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
}
$("filters").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-tag]");
  if (!b) return;
  FILTER = b.dataset.tag || null;
  draw();
});
$("grid").addEventListener("click", (ev) => {
  const c = ev.target.closest("[data-i]");
  if (!c) return;
  open(ITEMS[+c.dataset.i]);
});
function open(w) {
  $("lbin").innerHTML = shotHTML(w) + `<div class="lbody">
    ${w.kicker ? `<div class="kick">${esc(w.kicker)}</div>` : ""}
    <h2>${esc(w.title)}</h2>
    ${w.blurb ? `<p>${esc(w.blurb)}</p>` : ""}
    ${(w.stats || []).length ? `<div class="reads">${w.stats.map(([k, v]) =>
      `<div><div class="rv">${esc(v)}</div><div class="rk">${esc(k)}</div></div>`).join("")}</div>` : ""}
    ${w.href ? `<div class="tags" style="margin-top:.6rem"><a class="fb" href="${esc(w.href)}" target="_blank" rel="noopener">open it &rarr;</a></div>` : ""}
  </div>`;
  $("lb").classList.add("on");
}
function shut() { $("lb").classList.remove("on"); $("lbin").innerHTML = ""; }
$("lbx").addEventListener("click", shut);
$("lb").addEventListener("click", (ev) => { if (ev.target === $("lb")) shut(); });
addEventListener("keydown", (ev) => { if (ev.key === "Escape") shut(); });
draw();

/* the ledger is derived, never typed — add an entry and these move by
   themselves, which is the whole point of keeping WORK as the one source */
(function ledger() {
  const live = ITEMS.filter(w => w.status === "live").length;
  const latest = ITEMS.map(w => w.date).filter(Boolean)[0] || "\u2014";
  const rows = [["built", ITEMS.length], ["live", live], ["tags", TAGS.length], ["latest", latest]];
  $("ledger").innerHTML = rows.map(([k, v]) =>
    `<div><div class="rv">${esc(v)}</div><div class="rk">${esc(k)}</div></div>`).join("");
})();

/* the same drifting field as the wall, minus the constellations — three
   parallax depths, one pre-rendered sprite, additive so they bloom */
(function sky() {
  const cv = $("sky"); if (!cv || !cv.getContext) return;
  const g = cv.getContext("2d");
  const DPR = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0, stars = [];
  const SP = 64, sprite = document.createElement("canvas");
  sprite.width = sprite.height = SP;
  (function cut() {
    const c = sprite.getContext("2d");
    const gr = c.createRadialGradient(SP/2, SP/2, 0, SP/2, SP/2, SP/2);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(.12, "rgba(248,250,255,.95)");
    gr.addColorStop(.28, "rgba(226,234,255,.42)");
    gr.addColorStop(.55, "rgba(200,214,255,.12)");
    gr.addColorStop(1, "rgba(180,200,255,0)");
    c.fillStyle = gr; c.fillRect(0, 0, SP, SP);
  })();
  function resize() {
    W = cv.width = Math.floor(innerWidth * DPR);
    H = cv.height = Math.floor(innerHeight * DPR);
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    const n = Math.max(160, Math.min(420, Math.round(innerWidth * innerHeight / 6500)));
    stars = Array.from({length: n}, () => {
      const d = Math.random() < .5 ? 0 : (Math.random() < .65 ? 1 : 2);
      return {x: Math.random() * W, y: Math.random() * H, d,
              vx: -(d * .55 + .35) * DPR, tw: Math.random() * 6.28,
              tws: .5 + Math.random() * 1.1,
              sz: (Math.random() < .12 ? 2.6 : 1) * (.8 + Math.random() * .7)};
    });
  }
  function step(now) {
    for (const s of stars) { s.x += s.vx; if (s.x < -8) s.x = W + 8; }
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "lighter";
    const t = now / 1000;
    for (const s of stars) {
      const a = [.55, .72, .95][s.d] * (0.7 + 0.3 * Math.sin(t * s.tws + s.tw));
      const r = (s.d * 1.5 + 3.2) * s.sz * DPR;
      g.globalAlpha = Math.min(1, a);
      g.drawImage(sprite, s.x - r, s.y - r, r * 2, r * 2);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  }
  let raf = 0;
  function loop(now) { step(now); raf = requestAnimationFrame(loop); }
  addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => {
    // a tab you are not looking at should not hold a GPU awake
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) raf = requestAnimationFrame(loop);
  });
  resize(); raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
